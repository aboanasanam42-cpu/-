name: Build Medical Accounting - Android APK + Windows EXE

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Generate CI debug keystore
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
      - name: Build debug APK
        run: gradle assembleDebug --stacktrace --no-daemon
      - name: Verify APK
        run: test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk MedicalAccounting-Android.apk
      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: MedicalAccounting-Android-APK
          path: MedicalAccounting-Android.apk
          if-no-files-found: error
          retention-days: 30
      - name: Build signed release APK when signing secrets are available
        if: ${{ env.KEYSTORE_BASE64 != '' && env.STORE_PASSWORD != '' && env.KEY_PASSWORD != '' }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > my-upload-key.jks
          gradle assembleRelease --stacktrace --no-daemon
          test -s app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk MedicalAccounting-Android-release.apk
      - name: Upload signed release artifact
        if: ${{ env.KEYSTORE_BASE64 != '' && env.STORE_PASSWORD != '' && env.KEY_PASSWORD != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: MedicalAccounting-Android-Release-APK
          path: MedicalAccounting-Android-release.apk
          if-no-files-found: error
          retention-days: 30

  windows:
    name: Build Windows EXE
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install desktop dependencies
        run: python -m pip install -r desktop/requirements.txt
      - name: Build real Windows executable
        run: pyinstaller --noconfirm --clean --onefile --windowed --name MedicalAccounting-Desktop desktop/medical_accounting_desktop.py
      - name: Verify EXE
        shell: pwsh
        run: |
          if (!(Test-Path 'dist/MedicalAccounting-Desktop.exe')) { throw 'EXE was not created' }
          if ((Get-Item 'dist/MedicalAccounting-Desktop.exe').Length -lt 100000) { throw 'EXE is unexpectedly small' }
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: MedicalAccounting-Windows-EXE
          path: dist/MedicalAccounting-Desktop.exe
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish direct downloads
    needs: [android, windows]
    if: ${{ needs.android.result == 'success' && needs.windows.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download Android artifact
        uses: actions/download-artifact@v4
        with:
          name: MedicalAccounting-Android-APK
          path: release
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: MedicalAccounting-Windows-EXE
          path: release
      - name: Download signed Android artifact if available
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: MedicalAccounting-Android-Release-APK
          path: release
      - name: Publish GitHub Release with APK and EXE
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="medical-accounting-build-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "التطبيق المحاسبي الطبي الشامل - Build ${GITHUB_RUN_NUMBER}" \
            --notes "نسخة بناء حقيقية من التطبيق. تشمل APK للأندرويد وEXE للويندوز.\n\nAndroid: API 24+ / Target API 36\nWindows: Windows 10/11 x64\n\nملاحظة: APK غير الموقّع الخاص بالـ CI للتجربة المباشرة، وتظهر نسخة Release الموقعة فقط إذا كانت أسرار التوقيع موجودة." \
            --latest
      - name: Print direct download URLs
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "medical-accounting-build-${GITHUB_RUN_NUMBER}" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[] | [.name,.url] | @tsv'
